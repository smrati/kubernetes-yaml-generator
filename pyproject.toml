[project]
name = "kyamlgen"
version = "0.1.0"
description = "Form-driven Kubernetes YAML generator with cross-object semantic validation"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "jinja2>=3.1",
    "python-multipart>=0.0.12",
    "pyyaml>=6.0",
    "jsonschema>=4.23",
    "referencing>=0.35",
    "kubernetes-validate>=1.36",
]

[project.scripts]
kyamlgen = "kyamlgen.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "SIM", "B", "BLE", "PL", "C4"]
ignore = ["PLR0913"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["BLE001", "PLR2004"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kyamlgen"]

[tool.pytest.ini_options]
testpaths = ["tests"]
