kind: ServiceAccount
questions:
  - prompt: >-
      What is a ServiceAccount?
    options:
      - An identity a pod runs as, against the API server
      - A set of permissions
      - A token that authenticates a human
      - A way to name a pod
    answer: 0
    why: >-
      It is the identity. The permissions are a Role or ClusterRole, and the two are
      joined by a RoleBinding. A ServiceAccount on its own grants nothing.

  - prompt: >-
      What happens when you create a ServiceAccount with no RoleBinding?
    options:
      - It grants the default permissions
      - It grants nothing, because permissions come from a binding
      - It grants read access to its own namespace
      - It is rejected
    answer: 1
    why: >-
      Creating a ServiceAccount grants nothing. The permissions come from a
      RoleBinding or ClusterRoleBinding that names it — which is why creating one
      and forgetting the binding is a silent no-op.

  - prompt: >-
      What is automountServiceAccountToken's default?
    options:
      - true
      - false
      - It depends on the pod's image
      - null, meaning the cluster decides
    answer: 0
    why: >-
      True, so every pod gets a token mounted at
      `/var/run/secrets/kubernetes.io/serviceaccount` whether it needs one or not.
      Turning it off for workloads that never talk to the API server is free
      security.

  - prompt: >-
      Which ServiceAccount does a pod use by default?
    options:
      - The one named `default` in its namespace
      - The one named `default` in the cluster
      - None — pods have no identity
      - The one named after the pod
    answer: 0
    why: >-
      Every namespace has a `default` ServiceAccount, and pods use it unless told
      otherwise. It is why the default account's permissions are worth looking at
      before you add your own.

  - prompt: >-
      Can a ServiceAccount in namespace `staging` be used by a pod in `production`?
    options:
      - Yes, if the pod names it
      - No — a ServiceAccount is namespaced
      - Yes, if the ServiceAccount has the same name in both
      - Only with a ClusterRoleBinding
    answer: 1
    why: >-
      A ServiceAccount is namespaced, and a pod can only use one from its own
      namespace. This is a boundary you can rely on.

  - prompt: >-
      You create a ServiceAccount and set automountServiceAccountToken: false on it.
      What happens to pods that use it?
    options:
      - No token is mounted into them
      - The token is mounted read-only
      - A token is mounted but cannot be used
      - The pod cannot start
    answer: 0
    why: >-
      No token is mounted at all. The pod then cannot call the API server with that
      identity — which is the point, if the workload has no reason to.

  - prompt: >-
      How does a pod get a token for its ServiceAccount?
    options:
      - The kubelet mounts it, from a projected volume
      - The pod fetches it from the API server at start-up
      - The ServiceAccount controller creates a Secret with the token
      - The token is in the pod's environment by default
    answer: 0
    why: >-
      Modern clusters use a projected, short-lived token rather than a long-lived
      Secret. The kubelet mounts it at the standard path, which is why that path is
      worth knowing about.
