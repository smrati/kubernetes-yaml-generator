kind: Secret
questions:
  - prompt: >-
      A Secret's values are base64-encoded. Are they encrypted?
    options:
      - Yes, and the key is held by the API server
      - No — base64 is an encoding, not a protection
      - Yes, if the Secret type is Opaque
      - Only when the cluster has encryption at rest enabled
    answer: 1
    why: >-
      Anyone who can read the Secret can read the secret. The protection comes from
      access control, and from the fact that `kubectl describe secret` does not print
      the values.

  - prompt: >-
      Which field should you normally use to create a Secret?
    options:
      - data, with values base64-encoded by you
      - stringData, with plain values, encoded by the API server
      - Either — they are identical
      - Neither; Secrets hold only TLS material
    answer: 1
    why: >-
      `stringData` is plain text and the API server encodes it. `data` wants
      base64, which means every value has to be encoded by hand and there is no way
      to tell a typo from a secret.

  - prompt: >-
      You change a Secret's value. A running pod reads it through envFrom. What does
      the pod see?
    options:
      - The new value, within seconds
      - The old value, until the pod restarts
      - The new value, because the pod is restarted automatically
      - Neither value — the pod crashes
    answer: 1
    why: >-
      Environment variables are fixed at container start. Rotating a Secret's value
      does nothing to a running pod — you have to restart it, which is why rotation
      usually means changing the pod template to trigger a rollout.

  - prompt: >-
      What does a Secret of type kubernetes.io/tls expect?
    options:
      - A certificate and a private key under tls.crt and tls.key
      - A password under password
      - A username and password
      - A Docker registry credential
    answer: 0
    why: >-
      The `kubernetes.io/tls` type expects a PEM certificate in `tls.crt` and its
      private key in `tls.key`. It is what an Ingress references for TLS termination.

  - prompt: >-
      Where is a pod's service account token mounted by default?
    options:
      - /var/run/secrets/kubernetes.io/serviceaccount
      - /etc/kubernetes/secrets
      - /var/run/secrets/tokens
      - It is not mounted
    answer: 0
    why: >-
      That is the default path, along with the `ca.crt` and `namespace` files. It
      is mounted into every pod by default, whether or not the pod talks to the API
      server — which is why `automountServiceAccountToken: false` is free security.

  - prompt: >-
      Can a pod in namespace `staging` mount a Secret from namespace `production`?
    options:
      - Yes, if it has permission
      - No — a Secret is namespaced
      - Yes, if the Secret has the same name
      - Only if the Secret is of type Opaque
    answer: 1
    why: >-
      A Secret is namespaced, and pod volume references only resolve within the pod's
      own namespace. This is a deliberate boundary, and it is why the same
      credentials do not leak between environments by accident.

  - prompt: >-
      What is the difference between `data` and `stringData` when both are set?
    options:
      - They are merged, and stringData wins
      - data wins
      - The API server rejects the object
      - stringData is ignored
    answer: 0
    why: >-
      They are merged, and `stringData` takes precedence for the same key. The API
      server converts stringData into data and never stores stringData itself.
