<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}kyamlgen{% endblock %}</title>
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="/">kyamlgen</a>
      <span class="topbar-note">Kubernetes YAML generator</span>
      <span class="spacer"></span>
      <span class="muted">schema bundle v{{ version }}</span>
    </header>
    <main>{% block content %}{% endblock %}</main>
  </body>
</html>
