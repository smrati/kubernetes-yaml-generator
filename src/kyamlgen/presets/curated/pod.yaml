# A bare Pod.
#
# Useful for debugging and one-shot tasks, and not much else: nothing manages
# this pod.  It will not be replaced when the node dies, it will not be
# restarted with a new image, and it will not be scaled.  For anything
# long-lived, use a Deployment.
apiVersion: v1
kind: Pod
metadata:
  name: my-debug-pod
  labels:
    app: my-debug-pod
spec:
  containers:
    - name: debug
      image: busybox:1.36
      command:
        - sleep
        - "3600"
