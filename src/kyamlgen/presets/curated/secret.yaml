# Secrets hold credentials.
#
# `stringData` is the friendly form: the API server encodes it into `data` for
# you.  Write `data` yourself only if you are base64-encoding by hand.
#
# Note that a Secret's values are only base64-encoded, not encrypted.  Anyone
# who can read the Secret can read the secret.
apiVersion: v1
kind: Secret
metadata:
  name: my-app-secret
type: Opaque
stringData:
  DB_PASSWORD: change-me
